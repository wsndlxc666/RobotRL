schema: 1
name: robocasa365
status: active

objective: >
  在 RoboCasa365(robocasa 1.0.1 + RLinf)上把 pi0.5 评测管线跑通,
  建立 baseline,再推进到 FlowSDE 在线微调。

code:
  - path: /root/autodl-tmp/RLinf
    origin: https://github.com/RLinf/RLinf
    commit: 0067f7d5ce525c18bda439ed8dbb638abafd6a06
  - path: /root/autodl-tmp/robocasa365
    origin: https://github.com/robocasa/robocasa
    commit: 3443cdf3dd20f9ae8ed41adba442059b506891d0
    package: robocasa 1.0.1 (editable)
  - path: /root/autodl-tmp/robosuite_master
    origin: https://github.com/ARISE-Initiative/robosuite
    commit: 5ce6643f3092639d08f7b0f90ed1c6a84f50552c
    note: 365 需要 master 版 robosuite

env:
  venv: /root/autodl-tmp/RLinf/.venv-robocasa365
  python: "3.11"
  rebuild: projects/robocasa365/run/install.sh
  required_env:
    ROBOCASA_PATH: /root/autodl-tmp/robocasa365
    ROBOCASA_ASSETS_PATH: /autodl-fs/data/robocasa365_assets
    MUJOCO_GL: egl
    PYOPENGL_PLATFORM: egl
    NUMBA_DISABLE_JIT: "1"

models:
  - name: pi05_pretrain_human300_75k
    path: /autodl-fs/data/robocasa365/models/pi05_pretrain_human300
    role: policy
    source: hf://robocasa/robocasa365_checkpoints
    note: multitask_learning/75000
  - name: pi05_robocasa365_openpi
    path: /autodl-fs/data/robocasa365/models/pi05_robocasa365_openpi
    role: policy
    source: hf://robocasa/robocasa365_checkpoints

data:
  - name: robocasa365_assets
    path: /autodl-fs/data/robocasa365_assets
    size: 34G
    env: ROBOCASA_ASSETS_PATH
    source: hf://robocasa/robocasa-assets + hf://nvidia/PhysicalAI-Robotics-Manipulation-Objects-Kitchen-MJCF
    note: 含 _downloads/*.zip 11G(解压后可删)与 _downloads_lw 1.3G

entrypoints:
  install: projects/robocasa365/run/install.sh
  download: projects/robocasa365/run/dl_365.sh
  unpack: projects/robocasa365/run/unpack_365.sh
  eval: projects/robocasa365/run/run_task_eval.sh
  readme: projects/robocasa365/run/README.md

eval_tasks:
  - OpenDrawer
  - PickPlaceCounterToCabinet
  - PickPlaceDrawerToCounter
  - SlideDishwasherRack
  - TurnOnMicrowave
  - CloseToasterOvenDoor
  - CoffeeSetupMug

artifacts:
  root: /autodl-fs/data/robocasa365
  planned_root: /autodl-fs/data/artifacts/robocasa365
  big_file_threshold: 50MB

runs: []
